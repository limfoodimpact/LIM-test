<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIM Story</title>
<style>
:root{--n:#1F4E79;--g:#E8C97A;--c:#FFF6E9}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;color:#173044;overflow-x:hidden}header{position:fixed;z-index:9;top:0;width:100%;height:66px;background:#fffffff0;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid #edf1f3}header img{height:38px!important;width:auto!important}header a{text-decoration:none;color:var(--n);font-weight:800;font-size:13px}.s{min-height:100svh;display:grid;place-items:center;text-align:center;padding:85px 18px 60px;position:relative;overflow:hidden}.intro{background:linear-gradient(#fff,#fffaf3)}h1,h2{margin:0;color:var(--n);line-height:1.13;letter-spacing:-.055em}h1{font-size:clamp(48px,7vw,78px)}h2{font-size:clamp(40px,6vw,66px)}.k{font-size:10px;letter-spacing:.18em;font-weight:900;color:#3E7CB1;margin-bottom:20px}.dot{width:30px;height:30px;border-radius:50%;background:var(--g);margin:0 auto 30px;box-shadow:0 0 17px #e8c97a55;position:relative}.dot:after{content:"";position:absolute;inset:-13px;border-radius:50%;background:#e8c97a22;animation:b 3.4s ease-in-out infinite}@keyframes b{50%{transform:scale(1.45);opacity:.4}}.gather{background:#fff}.field{height:390px;width:min(760px,90vw);position:relative;margin:35px auto 0}.p{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--g);opacity:0;transform:scale(.3)}.active .p{animation:pop .65s ease forwards}@keyframes pop{to{opacity:1;transform:scale(1)}}.hubS{background:var(--n);color:#fff}.hubS h2{color:#fff}.hubstage{height:440px;width:min(820px,92vw);position:relative;margin:auto}.hub{position:absolute;left:50%;top:50%;width:145px;height:145px;margin:-72px;border:1px solid var(--g);border-radius:50%;display:grid;place-items:center;font-weight:950;letter-spacing:.08em;box-shadow:0 0 0 18px #e8c97a10}.active .hub{animation:hp 2.6s ease 1.3s 1}@keyframes hp{25%,55%,80%{box-shadow:0 0 0 30px #e8c97a20,0 0 38px #e8c97a25}}.id{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--g);transition:all 1.3s ease}.more{background:linear-gradient(#f8fafb,#fff)}.ms{height:590px;width:min(980px,94vw);position:relative;margin:auto}.mh{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px;border-radius:50%;background:var(--n);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}.ray{position:absolute;left:50%;top:50%;width:var(--l);height:1px;transform-origin:0;transform:rotate(var(--a));background:linear-gradient(90deg,#e8c97acc,#e8c97a22);opacity:0}.ray:after{content:"";position:absolute;right:-5px;top:-5px;width:11px;height:11px;border-radius:50%;background:var(--g)}.active .ray{animation:show .8s ease forwards;animation-delay:var(--d)}@keyframes show{to{opacity:1}}.lab{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);font-weight:900;color:var(--n);opacity:0;white-space:nowrap}.active .lab{animation:show .6s forwards;animation-delay:var(--d)}.cont{background:var(--c)}.final a{display:inline-flex;margin-top:34px;padding:13px 20px;border-radius:999px;background:var(--n);color:#fff;text-decoration:none;font-weight:850}.rv{opacity:0;transform:translateY(20px);transition:.8s}.active .rv{opacity:1;transform:none}@media(max-width:700px){.s{padding:78px 14px 55px}.field{height:320px}.hubstage{height:390px}.hub{width:122px;height:122px;margin:-61px}.ms{height:490px}.lab{font-size:12px}.mh{width:80px;height:80px;margin:-40px;font-size:11px}}@media(prefers-reduced-motion:reduce){.rv,.p,.ray,.lab{opacity:1;transform:none;animation:none!important}.dot:after,.hub{animation:none!important}}
</style>
<style id="story-v2-motion-balance">
/* 장면 사이 호흡을 일정하게 */
.s{min-height:100svh}
.gather h2{margin-bottom:8px}
.hubS h2{margin-bottom:0}
.more h2{margin-bottom:4px}

/* '하나둘 모입니다' — 점들이 중앙에 몰려 있지 않고 실제로 하나씩 생겨나는 느낌 강화 */
.p{
  box-shadow:0 0 0 0 rgba(232,201,122,0);
}
.active .p{
  animation:popV2 .72s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes popV2{
  0%{opacity:0;transform:scale(.2)}
  65%{opacity:1;transform:scale(1.32);box-shadow:0 0 0 8px rgba(232,201,122,.08)}
  100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(232,201,122,0)}
}

/* HUB — 들어온 뒤 잠깐 밝아지는 정도로 절제 */
.hub{transition:transform .45s ease}
.hubS.active .hub{
  animation:hubV2 3s ease 1.35s 1 both;
}
@keyframes hubV2{
  0%,100%{transform:scale(1);box-shadow:0 0 0 18px rgba(232,201,122,.06)}
  32%{transform:scale(1.035);box-shadow:0 0 0 28px rgba(232,201,122,.13),0 0 34px rgba(232,201,122,.15)}
  58%{transform:scale(1);box-shadow:0 0 0 20px rgba(232,201,122,.07)}
  78%{transform:scale(1.025);box-shadow:0 0 0 25px rgba(232,201,122,.11)}
}

/* MORE — 목적지 글자를 조금 더 읽기 쉽게 */
.lab{
  font-size:16px;
  letter-spacing:-.025em;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.78);
}
.more .ms{margin-top:12px}

/* 마지막은 버튼보다 골드점/문장이 먼저 보이도록 */
.final a{margin-top:42px;font-size:13px}
.final .dot{margin-bottom:38px}

@media(max-width:700px){
  /* 모바일에서는 선 길이를 화면 폭에 맞춰 축소 */
  .ms{width:94vw!important;height:470px!important}
  .ray:nth-of-type(1){--l:34vw!important}
  .ray:nth-of-type(2){--l:40vw!important}
  .ray:nth-of-type(3){--l:35vw!important}
  .ray:nth-of-type(4){--l:41vw!important}
  .ray:nth-of-type(5){--l:38vw!important}
  .ray:nth-of-type(6){--l:34vw!important}
  .ray:nth-of-type(7){--l:39vw!important}
  .ray:nth-of-type(8){--l:35vw!important}
  .lab{font-size:11px;padding:4px 6px}
  .gather .field{margin-top:22px}
  .hubstage{margin-top:4px}
}
</style>

<style id="story-v3-rhythm">
.intro .dot{width:36px;height:36px;margin-bottom:38px}.intro .dot:after{inset:-16px}
.gather .field{max-width:700px}.hubS .k{margin-bottom:15px}.hubS .hubstage{margin-top:-6px}
.more .ms{transform:translateY(8px)}.more .mh{box-shadow:0 0 0 14px rgba(31,78,121,.055),0 8px 26px rgba(31,78,121,.12)}
.more .ray:nth-of-type(2){height:1.4px}.more .ray:nth-of-type(5){height:1.5px}.more .ray:nth-of-type(7){height:.8px}
.cont h2{line-height:1.2}.cont .dot{width:18px;height:18px;box-shadow:none}.cont .dot:after{display:none}.final .dot{width:32px;height:32px}
@media(max-width:700px){.intro .dot{width:32px;height:32px}.gather .field{height:300px!important}.hubS .hubstage{height:370px!important}.more h2{font-size:38px}.more .ms{height:455px!important;margin-top:4px}.cont h2,.final h2{font-size:39px}}
</style>
<style id="story-v4-polish">
/* V4 FINAL POLISH — 구조는 유지, 타이포/여백/가독성만 정리 */
.s>div{width:100%}
.intro h1{max-width:760px;margin-inline:auto}
.gather h2,.hubS h2,.more h2,.cont h2,.final h2{max-width:820px;margin-inline:auto}

/* 장면 제목이 애니메이션과 경쟁하지 않도록 */
.gather h2{font-size:clamp(38px,5.4vw,60px)}
.hubS h2{font-size:clamp(38px,5.2vw,58px)}
.more h2{font-size:clamp(38px,5.2vw,58px)}

/* 점/허브 주변 시각적 중심 정리 */
.field,.hubstage,.ms{margin-left:auto;margin-right:auto}
.hub{font-size:16px}
.mh{letter-spacing:-.02em}

/* MORE 라벨은 목적지로 인식되되 과하게 카드화하지 않음 */
.lab{background:rgba(255,255,255,.62);font-weight:850}
.more .k{margin-bottom:17px}

/* 엔딩 버튼 존재감 축소 */
.final a{background:transparent;color:var(--n);border:1px solid rgba(31,78,121,.22);padding:11px 18px}
.final a:hover{background:rgba(31,78,121,.045)}

/* PC에서 화면이 너무 높은 경우도 중심 유지 */
@media(min-width:901px) and (max-height:760px){
 .s{min-height:760px;padding-top:82px;padding-bottom:52px}
 .field{height:330px}
 .hubstage{height:360px}
 .ms{height:490px}
}

/* 모바일: 문장 줄바꿈과 MORE 간격 */
@media(max-width:700px){
 header{padding-inline:18px}
 h1{font-size:46px}
 .gather h2{font-size:39px}
 .hubS h2{font-size:38px}
 .more h2{font-size:37px}
 .more .k{margin-bottom:14px}
 .lab{font-size:11px;max-width:92px;white-space:normal;line-height:1.25}
 .final a{margin-top:34px}
}
</style>
<style id="story-v5-hub-replay-fix">
/* HUB 점은 항상 흩어진 상태에서 시작. 제목을 먼저 읽은 뒤 이동한다. */
.hubS .id{opacity:1}
</style>
<style id="story-v6-final-tune">
/* V6: 이미 확정된 Flow는 유지. 장면 전환의 호흡과 마지막 마감만 미세 조정 */
.s{scroll-margin-top:66px}
.gather,.hubS,.more,.cont,.final{isolation:isolate}
.cont .rv{transition-duration:1s}
.final .rv{transition-duration:1.05s}
.final .dot{animation-delay:.12s}
@media(max-width:700px){
 .s{scroll-margin-top:62px}
 .cont,.final{min-height:92svh}
}
</style>
</head><body><header><a href="./index.html"><img src="./lim-logo.png" alt="LIM Food Impact"></a><a href="./index.html">처음으로</a></header><main>
<section class="s intro"><div class="rv"><div class="dot"></div><div class="k">LIM STORY</div><h1>하나의<br>작은 선택</h1></div></section>
<section class="s gather"><div><h2 class="rv">하나둘 모입니다</h2><div class="field" id="field"></div></div></section>
<section class="s hubS"><div><div class="k rv" style="color:#E8C97A">LIM HUB</div><h2 class="rv">작은 선택들이<br>LIM으로 모입니다</h2><div class="hubstage" id="hs"><div class="hub">LIM HUB</div></div></div></section>
<section class="s more"><div><div class="k rv">FROM HUB TO MORE</div><h2 class="rv">그리고,<br>다시 이어집니다</h2><div class="ms"><div class="mh">LIM HUB</div>
<div class="ray" style="--l:250px;--a:-155deg;--d:.2s"></div><div class="ray" style="--l:315px;--a:-120deg;--d:.4s"></div><div class="ray" style="--l:280px;--a:-70deg;--d:.6s"></div><div class="ray" style="--l:330px;--a:-25deg;--d:.8s"></div><div class="ray" style="--l:300px;--a:24deg;--d:1s"></div><div class="ray" style="--l:260px;--a:68deg;--d:1.2s"></div><div class="ray" style="--l:315px;--a:115deg;--d:1.4s"></div><div class="ray" style="--l:270px;--a:158deg;--d:1.6s"></div>
<div class="lab" style="--x:17%;--y:34%;--d:.8s">식량</div><div class="lab" style="--x:34%;--y:11%;--d:1s">아이들</div><div class="lab" style="--x:69%;--y:14%;--d:1.2s">지역사회</div><div class="lab" style="--x:86%;--y:37%;--d:1.4s">재난</div><div class="lab" style="--x:82%;--y:70%;--d:1.6s">환경</div><div class="lab" style="--x:61%;--y:88%;--d:1.8s">다음 연결</div><div class="lab" style="--x:27%;--y:80%;--d:2s">또 다른 MORE</div></div></div></section>
<section class="s cont"><div class="rv"><h2>다음 연결은<br>계속 만들어집니다</h2><div class="dot" style="margin-top:34px"></div></div></section>
<section class="s final"><div class="rv"><div class="dot"></div><h2>시작은 하나의<br>작은 선택이었습니다</h2><a href="./index.html">LIM으로 돌아가기</a></div></section></main>
<script>
const ss=[...document.querySelectorAll('.s')];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){
    e.target.classList.remove('active');
    void e.target.offsetWidth;
    e.target.classList.add('active');
  }else{
    e.target.classList.remove('active');
  }
}),{threshold:.30});
ss.forEach(s=>io.observe(s));
const f=document.getElementById('field'),pts=[[50,50],[42,45],[58,44],[37,57],[63,58],[48,65],[54,34],[31,41],[69,40],[27,62],[74,61],[42,76],[60,75],[22,50],[79,49],[35,29],[65,27],[50,84]];pts.forEach((q,i)=>{let d=document.createElement('i');d.className='p';d.style.left=q[0]+'%';d.style.top=q[1]+'%';d.style.animationDelay=i*.1+'s';f.appendChild(d)});
const hs=document.getElementById('hs');
const hubStart=[[14,20],[25,38],[15,68],[32,78],[83,22],[74,36],[87,62],[70,78],[50,12],[50,87]];
hubStart.forEach((q,i)=>{
  let d=document.createElement('i');
  d.className='id';
  d.dataset.x=q[0]; d.dataset.y=q[1];
  d.style.left=q[0]+'%'; d.style.top=q[1]+'%';
  hs.appendChild(d);
});
const hubScene=document.querySelector('.hubS');
let hubTimer=null;
function resetHub(){
  clearTimeout(hubTimer);
  hs.querySelectorAll('.id').forEach((d,i)=>{
    d.style.transition='none';
    d.style.left=d.dataset.x+'%';
    d.style.top=d.dataset.y+'%';
    d.style.opacity='1';
  });
  void hs.offsetWidth;
}
function playHub(){
  resetHub();
  hubTimer=setTimeout(()=>{
    hs.querySelectorAll('.id').forEach((d,i)=>{
      d.style.transition=`left 1.35s cubic-bezier(.2,.75,.25,1) ${i*.07}s, top 1.35s cubic-bezier(.2,.75,.25,1) ${i*.07}s, opacity .55s ease ${0.82+i*.07}s`;
      d.style.left='50%';
      d.style.top='50%';
      d.style.opacity='0';
    });
  },900);
}
const hubObs=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ playHub(); }
  else { resetHub(); }
}),{threshold:.62});
hubObs.observe(hubScene);
</script></body></html>
