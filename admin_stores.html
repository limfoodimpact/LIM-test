<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매장 문의 관리 | LIM Food Impact</title><style>*{box-sizing:border-box}body{margin:0;background:#F2F5F8;color:#263746;font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all}header,main{max-width:850px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}header img{width:170px;max-width:45vw}a{color:#1F4E79}h1,h2,h3{color:#1F4E79;line-height:1.4}h1{font-size:clamp(28px,6vw,40px)}section,article{background:white;border:1px solid #dce5ec;border-radius:20px;padding:26px;margin-bottom:20px}.hero{background:#FFF6E9}.tag{color:#1F4E79;font-weight:bold}label{display:block;font-weight:bold;margin:20px 0 6px}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{width:100%;padding:12px;border:1px solid #aebdca;border-radius:10px;background:white;color:#263746}textarea{min-height:100px}button,.cta{display:inline-block;padding:13px 21px;min-height:48px;border:0;border-radius:12px;background:#E8C97A;color:#1F4E79;font-weight:bold;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}article button{margin-top:16px;margin-right:10px}article button:last-child{background:#fff;color:#a03932;border:1px solid #d8b5b1}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}.note{font-size:14px;color:#526779}.status{white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}[hidden]{display:none!important}.trap{position:absolute;left:-10000px}details{background:#f2f5f8;padding:14px;border-radius:12px;margin-top:20px}summary{cursor:pointer}article p{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:550px){header,main{padding:14px}section,article{padding:20px}.grid{grid-template-columns:1fr}}

</style></head><body><header><a href="./index.html"><img src="./lim-logo.png" alt="LIM Food Impact 홈으로"></a><a href="./index.html">홈으로</a></header><main><section class="hero"><h1>매장 참여 문의 관리</h1><a href="./admin_lim.html">이름 공개 관리 →</a><p class="note">연락처와 메모는 운영자 전용입니다. 접수 후 90일이 지나면 삭제됩니다.</p></section><section id="login"><h2>운영자 로그인</h2><form id="loginForm"><label for="email">이메일</label><input type="email" id="email" required autocomplete="username"><label for="password">비밀번호</label><input type="password" id="password" required autocomplete="current-password"><button>로그인</button></form></section><section id="console" hidden><button id="refresh">새로고침</button> <button id="logout">로그아웃</button><label for="filter">상태</label><select id="filter"><option value="">전체</option><option>새 문의</option><option>상담 중</option><option>참여 확정</option><option>보류</option><option>종료</option></select></section><p id="message" class="status" role="status"></p><section id="storeManager" class="store-manager" hidden><h2>참여 매장 관리</h2><p class="note">승인된 매장과 사장님 로그인 계정을 언제든 연결·변경할 수 있습니다.</p><div id="stores"></div></section><h2 id="inquiryTitle" hidden>참여 문의</h2><div id="records"></div></main><script>const BASE='https://slrbqhygpexksvduluev.supabase.co',KEY='sb_publishable_K9fILZLweR1Qi8IBQyNEmA_OMV1F4yb';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('lim_admin_token')||'',rows=[],stores=[];function clear(){token='';rows=[];stores=[];sessionStorage.removeItem('lim_admin_token');$('#records').replaceChildren();$('#stores').replaceChildren();$('#storeManager').hidden=true;$('#inquiryTitle').hidden=true;$('#console').hidden=true;$('#login').hidden=false}async function rpc(name,body={}){const r=await fetch(BASE+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401||r.status===403)clear();throw Error('요청 실패')}return d}function text(tag,value,parent){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}function renderStores(){const root=$('#stores');root.replaceChildren();if(!stores.length){text('p','승인된 참여 매장이 없습니다.',root);return}for(const s of stores){const card=document.createElement('article');const head=document.createElement('div');head.className='admin-store-head';const left=document.createElement('div');text('h3',s.store_name,left);const meta=text('div',(s.region||'지역 미등록')+' · '+s.store_code,left);meta.className='store-code';head.append(left);card.append(head);const state=text('p',s.owner_email?'연결 이메일: '+s.owner_email:'사장님 계정이 아직 연결되지 않았습니다.',card);state.className=s.owner_email?'owner-state owner-linked':'owner-state';const row=document.createElement('div');row.className='approve-row';const email=document.createElement('input');email.type='email';email.placeholder='사장님 로그인 이메일';email.autocomplete='email';email.value=s.owner_email||'';email.setAttribute('aria-label',s.store_name+' 사장님 로그인 이메일');const btn=text('button',s.owner_email?'계정 연결 변경':'계정 연결',row);row.prepend(email);card.append(row);const help=text('p','Supabase Authentication에 만든 사장님 이메일을 입력합니다. 같은 이메일로 다시 연결하면 현재 매장 연결이 유지됩니다.',card);help.className='approve-help';btn.onclick=async()=>{const e=email.value.trim().toLowerCase();if(!e||!e.includes('@')){alert('사장님 로그인 이메일을 입력해 주세요.');return}if(!confirm(s.store_name+'의 사장님 로그인 계정을 '+e+' 로 연결할까요?'))return;btn.disabled=true;try{await rpc('link_store_owner_by_email',{p_store_id:s.id,p_owner_email:e});$('#message').textContent=s.store_name+' · 사장님 계정 연결 완료';await loadStores()}catch(err){console.error(err);$('#message').textContent='계정을 연결하지 못했습니다. 이메일 계정과 매장 연결 상태를 확인해 주세요.'}finally{btn.disabled=false}};root.append(card)}}
function render(){$('#records').replaceChildren();const items=rows.filter(r=>!$('#filter').value||r.status===$('#filter').value);if(!items.length){text('p','해당하는 문의가 없습니다.',$('#records'));return}for(const r of items){const card=document.createElement('article');text('h2',r.store,card);text('p',r.region+' · '+r.food+' · '+r.intent,card);const a=text('a',r.phone,card);a.href='tel:'+r.phone;text('p','접수: '+new Date(r.created_at).toLocaleString('ko-KR')+' / '+r.id,card);text('p',r.question||'문의 내용 없음',card);const statusLabel=text('label','상담 진행 상태',card);statusLabel.htmlFor='status-'+r.id;const status=document.createElement('select');status.id='status-'+r.id;status.setAttribute('aria-label',r.store+' 상담 상태');for(const name of ['새 문의','상담 중','참여 확정','보류','종료']){const o=document.createElement('option');o.textContent=name;status.append(o)}status.value=r.status;card.append(status);const noteLabel=text('label','운영자 전용 메모',card);noteLabel.htmlFor='note-'+r.id;const noteHelp=text('p','신청자에게 전송되지 않습니다. 전화·문자로 상담한 내용을 기록해 주세요.',card);noteHelp.className='note';noteHelp.id='note-help-'+r.id;const note=document.createElement('textarea');note.id='note-'+r.id;note.setAttribute('aria-describedby',noteHelp.id);note.value=r.admin_note;note.maxLength=2000;note.setAttribute('aria-label',r.store+' 상담 메모');note.placeholder='예: 전화로 안내 완료. 다음 주 시작 희망.';card.append(note);const dateLabel=text('label','다음 연락 예정일',card);dateLabel.htmlFor='date-'+r.id;const dateHelp=text('p','운영자가 확인하는 일정입니다. 자동 알림은 발송되지 않습니다.',card);dateHelp.className='note';dateHelp.id='date-help-'+r.id;const date=document.createElement('input');date.id='date-'+r.id;date.setAttribute('aria-describedby',dateHelp.id);date.type='date';date.value=r.next_contact||'';date.setAttribute('aria-label','다음 연락 예정일');card.append(date);const save=text('button','변경 저장',card);save.onclick=async()=>{save.disabled=true;try{await rpc('review_store_inquiry',{p_id:r.id,p_status:status.value,p_note:note.value,p_next:date.value||null,p_delete:false});await load();$('#message').textContent='운영자용 기록을 저장했습니다. 신청자에게 메시지가 전송되지는 않습니다.'}catch{$('#message').textContent='저장하지 못했습니다. 로그인과 연결을 확인해 주세요.'}finally{save.disabled=false}};
const approveBox=document.createElement('div');approveBox.className='approve-box';
const approveTitle=text('strong','참여 승인',approveBox);
const approveRow=document.createElement('div');approveRow.className='approve-row';
const code=document.createElement('input');code.type='text';code.placeholder='매장 코드 예: yeongwol01';code.autocomplete='off';code.setAttribute('aria-label',r.store+' 매장 코드');
const approve=text('button','승인',approveRow);
approveRow.prepend(code);approveBox.append(approveRow);
const approveHelp=text('p','승인하면 참여 확정 상태가 되고 매장 계정 연결 준비가 됩니다.',approveBox);approveHelp.className='approve-help';
approve.onclick=async()=>{const v=code.value.trim().toLowerCase();if(!/^[a-z0-9][a-z0-9_-]{1,39}$/.test(v)){alert('매장 코드는 영문 소문자·숫자·-·_ 로 2~40자 입력해 주세요.');return}
if(!confirm(r.store+'을(를) 참여 매장으로 승인할까요?'))return;
approve.disabled=true;try{
 const storeId=await rpc('approve_store_inquiry',{p_inquiry_id:r.id,p_store_code:v});
 approveBox.innerHTML='';
 const done=text('strong','참여 승인 완료',approveBox);
 const ownerRow=document.createElement('div');ownerRow.className='approve-row';
 const email=document.createElement('input');email.type='email';email.placeholder='사장님 로그인 이메일';email.autocomplete='email';email.setAttribute('aria-label',r.store+' 사장님 로그인 이메일');
 const linkBtn=text('button','계정 연결',ownerRow);ownerRow.prepend(email);approveBox.append(ownerRow);
 const help=text('p','Supabase Authentication에 먼저 만들어진 사장님 계정을 이 매장과 연결합니다.',approveBox);help.className='approve-help';
 linkBtn.onclick=async()=>{const e=email.value.trim().toLowerCase();if(!e||!e.includes('@')){alert('사장님 로그인 이메일을 입력해 주세요.');return}
  linkBtn.disabled=true;try{await rpc('link_store_owner_by_email',{p_store_id:storeId,p_owner_email:e});$('#message').textContent=r.store+' · 사장님 계정 연결 완료';linkBtn.textContent='연결 완료';email.disabled=true}
  catch(err){console.error(err);$('#message').textContent='계정을 연결하지 못했습니다. Supabase Authentication에 같은 이메일 계정이 있는지 확인해 주세요.'}
  finally{linkBtn.disabled=false}
 };
 $('#message').textContent=r.store+' 승인 완료 · 사장님 계정을 연결할 수 있습니다.';
}catch(e){console.error(e);$('#message').textContent='승인하지 못했습니다. 매장 코드 중복 또는 연결 상태를 확인해 주세요.'}finally{approve.disabled=false}};
card.append(approveBox);
const del=text('button','완전 삭제',card);del.onclick=async()=>{if(!confirm('이 문의와 연락처를 완전히 삭제할까요? 복구할 수 없습니다.'))return;del.disabled=true;try{await rpc('review_store_inquiry',{p_id:r.id,p_status:r.status,p_note:'',p_next:null,p_delete:true});await load()}catch{$('#message').textContent='삭제하지 못했습니다.';del.disabled=false}};$('#records').append(card)}}async function loadStores(){stores=await rpc('get_admin_stores');$('#storeManager').hidden=false;renderStores()}async function load(){const result=await Promise.all([rpc('get_store_inquiries'),rpc('get_admin_stores')]);rows=result[0];stores=result[1];$('#login').hidden=true;$('#console').hidden=false;$('#storeManager').hidden=false;$('#inquiryTitle').hidden=false;renderStores();render()}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error();token=d.access_token;sessionStorage.setItem('lim_admin_token',token);$('#password').value='';await load();$('#message').textContent=''}catch{clear();$('#message').textContent='로그인 정보 또는 운영자 권한을 확인해 주세요.'}};$('#filter').onchange=render;$('#refresh').onclick=()=>load().catch(()=>$('#message').textContent='불러오지 못했습니다. 다시 로그인해 주세요.');$('#logout').onclick=clear;if(token)load().catch(()=>{clear();$('#message').textContent='다시 로그인해 주세요.'});</script></body></html>
