<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="site.css"><title>사장님 참여 | LIM Food Impact</title><style>
.owner-visual{padding:42px 0 30px;background:#fff}.owner-hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:42px;align-items:center}.owner-kicker{display:inline-block;font-weight:800;color:#315b86;background:#eef5fb;border-radius:999px;padding:9px 15px;margin-bottom:20px}.owner-visual h1{font-size:clamp(42px,5.5vw,68px);line-height:1.08;letter-spacing:-.055em;margin:0 0 20px;color:#17283b}.owner-visual h1 em{font-style:normal;color:#2476bd}.owner-visual .sub{font-size:21px;line-height:1.55;margin:0 0 28px;color:#34465a}.owner-visual .hero-btn{display:inline-flex;justify-content:center;min-width:220px}.poster-frame{overflow:hidden;border-radius:24px;box-shadow:0 18px 50px rgba(31,78,121,.14);background:#f3f7fa}.poster-frame img{display:block;width:100%;height:auto}.owner-flow{padding:58px 0;background:#f3f7fa}.owner-flow h2{text-align:center;font-size:34px;margin:0 0 32px}.owner-flow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.flow-card{background:#fff;border:1px solid #dbe5ed;border-radius:18px;padding:24px 18px;min-height:135px}.flow-card b{display:block;color:#7c8d9d;font-size:14px;margin-bottom:13px}.flow-card strong{font-size:19px;line-height:1.45;color:#17283b}.owner-note{text-align:center;margin:28px 0 0;color:#526475;font-size:16px}.apply-box{margin-top:48px!important}
@media(max-width:760px){.owner-visual{padding:34px 0 24px}.owner-hero-grid{grid-template-columns:1fr;gap:28px}.owner-kicker{margin-bottom:16px}.owner-visual h1{font-size:43px;line-height:1.12}.owner-visual .sub{font-size:18px;margin-bottom:22px}.owner-visual .hero-btn{width:100%}.poster-frame{border-radius:18px}.owner-flow{padding:44px 0}.owner-flow h2{text-align:left;font-size:30px}.owner-flow-grid{grid-template-columns:1fr 1fr}.flow-card{min-height:125px;padding:20px 17px}.flow-card strong{font-size:17px}.apply-box{margin-top:36px!important}}
</style></head><body>
<header class="wrap top"><a href="index.html"><img class="logo" src="lim-logo.png" alt="LIM Food Impact"></a><nav class="topnav"><a class="navlink" href="store.html">참여 매장</a><a class="btn primary" href="apply.html">사장님 참여</a></nav></header>
<main>
<section class="owner-visual"><div class="wrap owner-hero-grid"><div><span class="owner-kicker">음식점 한 달 시범사업</span><h1>원가는 줄이고,<br><em>가게의 가치는 높이고</em></h1><p class="sub">손님은 필요한 만큼,<br><strong>사장님은 체크만 해주세요.</strong></p><a class="btn primary hero-btn" href="#apply-form">시범사업 참여 문의</a></div><div class="poster-frame"><img src="owner-poster.jpg" alt="LIM 음식점 한 달 시범사업 안내 포스터"></div></div></section>
<section class="owner-flow"><div class="wrap"><h2>이렇게 운영됩니다.</h2><div class="owner-flow-grid"><div class="flow-card"><b>01</b><strong>LIM이 안내문을<br>준비합니다.</strong></div><div class="flow-card"><b>02</b><strong>손님이 필요한 만큼<br>선택합니다.</strong></div><div class="flow-card"><b>03</b><strong>사장님은<br>체크만 합니다.</strong></div><div class="flow-card"><b>04</b><strong>LIM이 기부로<br>연결합니다.</strong></div></div><p class="owner-note">한 달 동안 매장에서 실제로 확인해보는 시범사업입니다.</p></div></section>
<section class="soft" id="apply-form"><div class="wrap"><div class="apply-box"><h2>시범사업 참여 문의</h2><p class="lead">아래 내용만 남겨주시면 됩니다.</p><form onsubmit="event.preventDefault();document.getElementById('m').textContent='현재는 화면 확인용입니다. 실제 접수 기능은 다음 단계에서 연결합니다.'"><div class="form-grid"><div class="field"><label for="shop">매장명</label><input id="shop" required placeholder="예: ○○식당"></div><div class="field"><label for="name">사장님 성함</label><input id="name" required></div><div class="field"><label for="phone">연락처</label><input id="phone" required inputmode="tel" placeholder="010-0000-0000"></div><div class="field"><label for="area">지역</label><input id="area" placeholder="예: 강원 영월"></div><div class="field full"><button class="btn primary" style="width:100%;font-size:17px">참여 문의 보내기</button></div></div><p id="m" class="note"></p></form><p class="contact-note">이메일 문의 · limfoodimpact@gmail.com</p></div></div></section>
</main><footer class="footer">LIM FOOD IMPACT</footer></body></html>
