<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="stylesheet" href="site.css"><title>사장님 참여 | LIM Food Impact</title></head><body>
<header class="wrap top"><a href="index.html"><img class="logo" src="lim-logo.png" alt="LIM Food Impact"></a><nav class="topnav"><a class="navlink" href="store.html">참여 매장</a><a class="btn primary" href="apply.html">사장님 참여</a></nav></header>
<main class="soft">
<section class="apply-hero"><div class="wrap"><span class="badge">한 달 시범사업</span><h1>사장님은 체크만 해주세요.</h1><p>손님은 필요한 만큼,<br>사장님은 체크만.</p>
<div class="owner-points">
<div class="owner-point"><b>01</b><strong>안내문은<br>LIM이 준비합니다.</strong></div>
<div class="owner-point"><b>02</b><strong>손님 요청이 들어오면<br>체크만 해주세요.</strong></div>
<div class="owner-point"><b>03</b><strong>한 달 동안 체크한 내용을<br>LIM이 확인합니다.</strong></div>
</div></div></section>
<section><div class="wrap"><div class="apply-box"><h2>시범사업 참여 문의</h2><p class="lead">아래 내용만 남겨주시면 됩니다.</p>
<form onsubmit="event.preventDefault();document.getElementById('m').textContent='현재는 화면 확인용입니다. 실제 접수 기능은 다음 단계에서 연결합니다.'">
<div class="form-grid">
<div class="field"><label for="shop">매장명</label><input id="shop" required placeholder="예: ○○식당"></div>
<div class="field"><label for="name">사장님 성함</label><input id="name" required></div>
<div class="field"><label for="phone">연락처</label><input id="phone" required inputmode="tel" placeholder="010-0000-0000"></div>
<div class="field"><label for="area">지역</label><input id="area" placeholder="예: 강원 영월"></div>
<div class="field full"><button class="btn primary" style="width:100%;font-size:17px">참여 문의 보내기</button></div>
</div><p id="m" class="note"></p></form>
<p class="contact-note">이메일 문의 · limfoodimpact@gmail.com</p>
</div></div></section>
</main><footer class="footer">LIM FOOD IMPACT</footer></body></html>
