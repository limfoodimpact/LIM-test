<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site.css"><title>사장님 체크 | LIM</title></head><body><header class="wrap top"><a class="brand" href="index.html">LIM <span>FOOD IMPACT</span></a><a class="btn primary" href="apply.html">사장님 참여</a></header><main class="section soft"><div class="wrap"><div class="box" style="text-align:center"><span class="badge">사장님 체크</span><h1>홍제동우동국수</h1><p class="lead">손님 요청이 들어오면 한 번만 눌러주세요.</p><h2>면 적게</h2><div id="c" class="count">0</div><button id="p" class="plus">+1</button><button id="u" class="undo">−1</button><div id="r" class="recent">아직 체크가 없습니다.</div><p class="note">현재 기능 확인용입니다. 실제 저장은 다음 단계에서 연결합니다.</p></div></div></main><script>let n=0,last='';const c=document.getElementById('c'),r=document.getElementById('r');function d(){c.textContent=n;r.textContent=last?'최근 체크 '+last:'아직 체크가 없습니다.'}p.onclick=()=>{n++;last=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});d()};u.onclick=()=>{if(n)n--;d()};</script></body></html>
