<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site.css"><title>참여 매장 체크 | LIM</title></head><body><header class="wrap top"><a href="index.html"><img class="logo" src="lim-logo.png" alt="LIM Food Impact"></a><nav class="topnav"><a class="navlink" href="store.html">참여 매장</a><a class="btn primary" href="apply.html">사장님 참여</a></nav></header><main class="section soft"><div class="wrap"><div class="box"><div class="counter-head"><span class="badge">참여 매장 체크</span><h1>홍제동우동국수</h1><div class="counter-guide">손님 요청이 있을 때 해당 항목을<br>한 번만 눌러주세요.</div></div><div class="counter-list"><section class="count-item"><div class="count-label"><strong>메인 음식 줄이기</strong><span class="count-value" id="mainCount">0</span></div><div class="count-actions"><button class="count-plus" id="mainPlus">+1</button><button class="count-minus" id="mainMinus">−1</button></div></section><section class="count-item"><div class="count-label"><strong>반찬 줄이기 · 빼기</strong><span class="count-value" id="sideCount">0</span></div><div class="count-actions"><button class="count-plus" id="sidePlus">+1</button><button class="count-minus" id="sideMinus">−1</button></div></section></div><div class="total-card"><span>오늘의 총 체크</span><strong id="total">0</strong></div><p class="note">현재 기능 확인용입니다. 실제 기록 저장은 다음 단계에서 연결합니다.</p></div></div></main><script>let main=0,side=0;const mc=document.getElementById('mainCount'),sc=document.getElementById('sideCount'),t=document.getElementById('total');function d(){mc.textContent=main;sc.textContent=side;t.textContent=main+side}mainPlus.onclick=()=>{main++;d()};mainMinus.onclick=()=>{if(main>0)main--;d()};sidePlus.onclick=()=>{side++;d()};sideMinus.onclick=()=>{if(side>0)side--;d()};</script></body></html>
