</header><main><section class="hero"><div class="wrap"><span class="badge">한 달 시범사업</span><h1><small>함께할</small>음식점을 찾습니다.</h1><p>안 드실 음식은 주문할 때 빼고,<br><strong>사장님은 체크만 해주세요.</strong><br><strong>LIM이 기부합니다.</strong></p><div class="actions"><a class="btn primary" href="apply.html">시범사업 참여하기</a></div><div class="benefit">버려지는 음식은 줄이고,<br>가게의 좋은 이미지는 더하고.</div></div></section><section class="section soft" id="how"><div class="wrap"><h2>이렇게 참여합니다.</h2><div class="steps"><div class="step"><span class="num">01</span><strong>안내문을<br>식탁에 놓아요</strong></div><div class="step"><span class="num">02</span><strong>필요한 만큼<br>선택해요</strong></div><div class="step"><span class="num">03</span><strong>사장님은<br>체크만 해주세요</strong></div><div class="step"><span class="num">04</span><strong>LIM이<br>기부합니다</strong></div></div></div></section></main><footer class="footer">LIM FOOD IMPACT · limfoodimpact@gmail.com</footer>
<script id="lim-menu-js">
document.addEventListener('DOMContentLoaded',function(){
 const b=document.querySelector('.lim-menu-btn'), p=document.querySelector('.lim-menu-panel'), c=document.querySelector('.lim-menu-close');
 if(!b||!p)return;
 const open=()=>{p.classList.add('open');p.setAttribute('aria-hidden','false');b.setAttribute('aria-expanded','true');document.body.classList.add('menu-open')};
 const close=()=>{p.classList.remove('open');p.setAttribute('aria-hidden','true');b.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')};
 b.addEventListener('click',open); if(c)c.addEventListener('click',close);
 p.addEventListener('click',e=>{if(e.target===p)close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
});
</script>
</body></html>
